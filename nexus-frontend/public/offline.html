<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F19" />
  <title>Sem conexão · NEXUS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(circle at 100% 0, #1e3a8a55, transparent 60%), #0B0F19;
      color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    .card { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 20px 0 8px; font-size: 22px; color: #fff; }
    p { margin: 0 0 24px; color: #94a3b8; line-height: 1.5; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #FFB800; color: #0B0F19;
      font-size: 15px; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="NEXUS" />
    <h1>Você está sem conexão</h1>
    <p>Verifique o Wi-Fi ou os dados móveis. Assim que a internet voltar, suas aulas continuam de onde pararam.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
